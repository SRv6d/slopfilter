[package]
name = "slopfilter"
description = "Scores Matter articles, web feeds, and local text for likely AI authorship."
version = "0.1.0"
keywords = ["ai", "authorship", "detection", "llm", "prose"]
categories = ["command-line-utilities"]
edition = "2024"
authors = ["Marvin Vogt <m@rvinvogt.com>"]
license = "MIT"
homepage = "https://github.com/marvinvogt/slopfilter"
repository = "https://github.com/marvinvogt/slopfilter"
readme = "README.md"
exclude = [".devcontainer", ".github", "PLAN.md"]

[dependencies]
async-stream = "0.3.6"
anyhow = "1.0.104"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
feed-rs = "3.0.0"
futures-util = "0.3.34"
governor = "0.10.4"
html2text = "0.17.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.151"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { priority = -1, level = "warn" }
panic = "warn"
missing_errors_doc = "allow"

[profile.release]
lto = true
panic = "abort"
