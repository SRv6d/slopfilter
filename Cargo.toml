[package]
name = "slopfilter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
governor = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
