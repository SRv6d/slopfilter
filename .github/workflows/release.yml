---
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      publish_crate:
        description: Publish the crate as part of this release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build release archives
        run: nix build .#release-artifacts --out-link release-artifacts --no-update-lock-file

      - name: Verify archive reproducibility
        run: nix build .#release-artifacts --rebuild --no-link --no-update-lock-file

      - name: Prepare release archives
        run: |
          mkdir release-files
          cp release-artifacts/*.tar.gz release-files/

      - name: Upload release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: release-files/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  assemble-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOWNLOAD_DIR: release-files
      PROVENANCE_PATH: release-files/slopfilter-${{ inputs.tag }}.sigstore.json
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ env.DOWNLOAD_DIR }}
          merge-multiple: true

      - name: Create checksums
        run: |
          cd "$DOWNLOAD_DIR"
          export LC_ALL=C
          sha256sum slopfilter-*.tar.gz > SHA256SUMS

      - name: Upload release files
        run: gh release upload --clobber "$TAG" "$DOWNLOAD_DIR"/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release files
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.DOWNLOAD_DIR }}/*

      - name: Upload provenance bundle
        run: |
          cp "$BUNDLE_PATH" "$PROVENANCE_PATH"
          gh release upload --clobber "$TAG" "$PROVENANCE_PATH"
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-publish:
    needs: assemble-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.publish_crate
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: inputs.publish_crate
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: inputs.publish_crate
        with:
          just-version: 1.51.0
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: inputs.publish_crate
        id: auth
      - name: Publish crate
        if: inputs.publish_crate
        run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-release:
    needs: cargo-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        run: gh release edit "$TAG" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
